[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "embryoomics-ai"
version = "0.1.0"
description = "Auditable local mouse embryo single-cell RNA analysis"
requires-python = ">=3.11,<3.13"
dependencies = [
  "scanpy==1.11.5",
  "anndata==0.12.6",
  "numpy==2.3.5",
  "scipy==1.16.3",
  "pandas==2.3.3",
  "matplotlib==3.10.7",
  "python-igraph==1.0.0",
  "leidenalg==0.11.0",
  "streamlit==1.51.0",
  "PyYAML==6.0.3",
  "psutil==7.1.0",
]

[project.optional-dependencies]
test = ["pytest==9.0.1"]

[project.scripts]
embryoomics = "embryoomics.cli:main"

[tool.setuptools.packages.find]
include = ["embryoomics*"]
