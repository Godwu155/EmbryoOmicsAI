name: Python validation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  windows-python:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements-lock.txt
      - name: Create isolated environment
        run: python -m venv .ci-venv
      - name: Install locked dependencies
        run: ./.ci-venv/Scripts/python.exe -m pip install -r requirements-lock.txt
      - name: Check dependencies
        run: ./.ci-venv/Scripts/python.exe -m pip check
      - name: Run synthetic and interface tests
        run: ./.ci-venv/Scripts/python.exe -m pytest -q --junitxml=test-results/results.xml
      - name: Check syntax and undefined names
        run: ./.ci-venv/Scripts/python.exe -m ruff check embryoomics app.py scripts tests
      - name: Build development wheel
        run: ./.ci-venv/Scripts/python.exe -m pip wheel . --no-deps --wheel-dir dist
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: python-validation
          path: |
            test-results/*.xml
            dist/*.whl
